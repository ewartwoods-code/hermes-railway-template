name: Template checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Railway configuration
        run: |
          python3 -m json.tool railway.json >/dev/null
          curl --fail --location --silent --show-error https://railway.com/railway.schema.json -o /tmp/railway.schema.json
          python3 scripts/validate_railway_config.py /tmp/railway.schema.json railway.json
      - name: Run container smoke test
        run: scripts/smoke-test.sh
